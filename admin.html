<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f6ef">
    <title>Order management — Maxwellina Foods</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/admin.css">
    <script src="/admin.js" defer></script>
  </head>
  <body class="admin-page">
    <header class="site-header">
      <a class="brand" href="/" aria-label="Maxwellina Foods home"><img src="/logo.svg" alt="Maxwellina Foods"></a>
      <a class="header-order" href="/">Back to shop <span aria-hidden="true">↗</span></a>
    </header>
    <main class="admin-main">
      <section class="admin-heading">
        <p class="eyebrow"><span class="eyebrow-line"></span> Maxwellina Foods</p>
        <h1>Order <em>desk.</em></h1>
        <p>Review incoming orders and keep customers up to date.</p>
      </section>
      <section class="admin-panel" id="admin-login">
        <h2>Owner sign in</h2>
        <p>Use the private owner access token configured for this site.</p>
        <form id="admin-login-form">
          <label for="admin-token">Owner access token</label>
          <input id="admin-token" type="password" autocomplete="current-password" required>
          <button class="button button-dark" type="submit">View orders <span aria-hidden="true">↗</span></button>
        </form>
        <p class="admin-message" id="admin-login-message" role="alert"></p>
      </section>
      <section class="admin-orders" id="admin-orders" hidden>
        <div class="admin-orders-heading"><div><p class="eyebrow"><span class="eyebrow-line"></span> Your shop</p><h2>Recent orders</h2></div><div class="admin-actions"><button class="button admin-refresh" id="refresh-orders" type="button">Refresh</button><button class="button admin-logout" id="admin-logout" type="button">Sign out</button></div></div>
        <p class="admin-message" id="orders-message" role="status"></p>
        <div class="order-list" id="order-list"></div>
      </section>
    </main>
    <footer class="site-footer admin-footer"><div class="footer-bottom"><span>© <span id="current-year"></span> Maxwellina Foods. Made with care in Ghana.</span><a href="/">Back to shop</a></div></footer>
  </body>
</html>
